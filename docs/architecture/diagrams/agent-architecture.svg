<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="754" viewBox="0 0 1200 754" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de agentes del concierge</title>
  <desc id="description">El Concierge Agent atiende al huésped por voz o chat y delega a trece agentes internos agrupados por servicio. También accede a herramientas MCP y se comunica mediante A2A con un proveedor de seguridad externo. Human Handoff deriva solicitudes a recepción.</desc>
  <defs>
    <linearGradient id="canvas" x2="0" y2="1">
      <stop stop-color="#fcfbf8"/>
      <stop offset="1" stop-color="#f3f0e8"/>
    </linearGradient>
    <linearGradient id="concierge" x2="1" y2="1">
      <stop stop-color="#f4f9f3"/>
      <stop offset="1" stop-color="#e1ede2"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a59b84" opacity=".19"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#678275" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="external-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#836340" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <rect id="panel" width="258" height="317" rx="15" fill="#fbfaf6" stroke="#dedace"/>
    <rect id="node" width="211" height="50" rx="8" fill="#fff" stroke="#e8e4db"/>
    <path id="branches" d="M0 0v156M0 38h16M0 97h16M0 156h16"/>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #253630; }
      .headline { font-family: Georgia, 'Times New Roman', serif; font-size: 43px; letter-spacing: -1.7px; }
      .primary { font-size: 25px; font-weight: 700; letter-spacing: -.65px; }
      .title { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
      .group { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
      .role { font-size: 16px; font-weight: 700; letter-spacing: -.19px; }
      .detail { font-size: 13px; fill: #53645c; }
      .caption { font-size: 14px; fill: #53645c; }
      .edge-label { font-size: 12px; font-weight: 700; fill: #436354; }
      .external-label { fill: #785333; }
      .edge { fill: none; stroke: #678275; stroke-width: 1.55; stroke-linejoin: round; }
      .rail { fill: none; stroke: #bdc9bd; stroke-width: 1.35; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x=".5" y=".5" width="1199" height="753" rx="23" fill="url(#canvas)" stroke="#e2ddd1"/>
  <rect x="18" y="95" width="1164" height="636" rx="15" fill="url(#grid)"/>
  <text x="48" y="66" class="headline">Arquitectura de agentes</text>

  <g class="edge">
    <path d="M281 161h120" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M600 213v60M177 295v-22h846v22M459 273v22M741 273v22"/>
    <path d="M431 213v20a7 7 0 0 1-7 7H36a8 8 0 0 0-8 8v435a8 8 0 0 0 8 8h9" stroke="#8a9c90" marker-end="url(#arrow)"/>
  </g>
  <path d="M799 161h118" fill="none" stroke="#836340" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#external-arrow)" marker-end="url(#external-arrow)"/>
  <text x="340" y="149" text-anchor="middle" class="edge-label">Voz y chat</text>
  <text x="858" y="149" text-anchor="middle" class="edge-label external-label">A2A</text>
  <rect x="504" y="261" width="192" height="24" rx="12" fill="#ebf1e8" stroke="#d6e0d4"/>
  <text x="600" y="277" text-anchor="middle" class="edge-label">Delegación interna</text>

  <g transform="translate(48 109)">
    <rect width="230" height="104" rx="15" fill="#fffefa" stroke="#dedace"/>
    <circle cx="41" cy="52" r="22" fill="#f0eee5"/>
    <g transform="translate(29 40)" class="icon" color="#5d6757">
      <circle cx="12" cy="8" r="3.3"/>
      <path d="M5.5 19v-1.5a4 4 0 0 1 4-4h5a4 4 0 0 1 4 4V19"/>
    </g>
    <text x="76" y="48" class="title">Huésped</text>
    <text x="76" y="69" class="caption">Estancia activa</text>
  </g>
  <g transform="translate(404 109)">
    <rect y="4" width="392" height="104" rx="15" fill="#4f725c" opacity=".09"/>
    <rect width="392" height="104" rx="15" fill="url(#concierge)" stroke="#a4b9a8"/>
    <rect x="19" y="25" width="55" height="55" rx="13" fill="#295644"/>
    <g transform="translate(34 40)" class="icon" color="#f3f8f1">
      <path d="M4 17a8.5 8.5 0 0 1 17 0M2 18h21M4 21h17M12.5 6V4m-2 0h4"/>
    </g>
    <text x="92" y="49" class="primary">Concierge Agent</text>
    <text x="92" y="72" class="caption">Único punto de contacto con el huésped</text>
  </g>
  <g transform="translate(920 109)">
    <rect width="232" height="104" rx="15" fill="#fffbf2" stroke="#dfceb5"/>
    <circle cx="37" cy="52" r="21" fill="#f3e8d6"/>
    <g transform="translate(25 40)" class="icon" color="#815b32">
      <path d="M12 21s7-3 7-9V6l-7-3-7 3v6c0 6 7 9 7 9Z"/>
      <path d="m9 12 2 2 4-4"/>
    </g>
    <text x="67" y="48" class="group">Security Provider</text>
    <text x="67" y="69" class="caption">Agente externo</text>
  </g>

  <g transform="translate(48 295)">
    <use href="#panel"/>
    <rect x="15" y="15" width="34" height="34" rx="9" fill="#e5eee9"/>
    <g transform="translate(20 20)" class="icon" color="#346453">
      <path d="M21 3c-1.2-1-3.2.1-4.3 1.2L13 8l-7-2-2 2 5.5 3.5-3 3-3-.5-1.5 1.5 4 2 2 4L9.5 20l-.5-3 3-3 3.5 5.5 2-2-2-7 3.8-3.7C20.4 5.7 22 4.2 21 3Z"/>
    </g>
    <text x="60" y="38" class="group">Viajes y destinos</text>
    <use href="#branches" x="16" y="52" class="rail"/>
    <g transform="translate(32 65)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Flights</text>
      <text x="12" y="39" class="detail">Reservas y rastreo</text>
    </g>
    <g transform="translate(32 124)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Executive Transportation</text>
      <text x="12" y="39" class="detail">Uber y transporte ejecutivo</text>
    </g>
    <g transform="translate(32 183)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Local Guide</text>
      <text x="12" y="39" class="detail">Recomendaciones locales</text>
    </g>
  </g>

  <g transform="translate(330 295)">
    <use href="#panel"/>
    <rect x="15" y="15" width="34" height="34" rx="9" fill="#f0e9db"/>
    <g transform="translate(20 20)" class="icon" color="#80683a">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Zm6 13v5m-2.5-2.5h5M5 15v4m-2-2h4"/>
    </g>
    <text x="60" y="38" class="group">Experiencias</text>
    <use href="#branches" x="16" y="52" class="rail"/>
    <g transform="translate(32 65)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Personal Trainer Booking</text>
      <text x="12" y="39" class="detail">Reserva de entrenadores</text>
    </g>
    <g transform="translate(32 124)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Dining &amp; Reservations</text>
      <text x="12" y="39" class="detail">Reservas de restaurantes</text>
    </g>
    <g transform="translate(32 183)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Wellness &amp; Spa</text>
      <text x="12" y="39" class="detail">Tratamientos y disponibilidad</text>
    </g>
  </g>

  <g transform="translate(612 295)">
    <use href="#panel"/>
    <rect x="15" y="15" width="34" height="34" rx="9" fill="#e9eee1"/>
    <g transform="translate(20 20)" class="icon" color="#5d7043">
      <path d="M4 20h16M6 20V5h12v15M10 20v-5h4v5M9 8h1m4 0h1M9 11h1m4 0h1"/>
    </g>
    <text x="60" y="38" class="group">Servicios del hotel</text>
    <use href="#branches" x="16" y="52" class="rail"/>
    <path d="M16 208v59h16" class="rail"/>
    <g transform="translate(32 65)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Hotel Information</text>
      <text x="12" y="39" class="detail">Instalaciones y políticas</text>
    </g>
    <g transform="translate(32 124)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Guest Supplies</text>
      <text x="12" y="39" class="detail">Suministros e inventario</text>
    </g>
    <g transform="translate(32 183)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Room Service</text>
      <text x="12" y="39" class="detail">Menú y pedidos</text>
    </g>
    <g transform="translate(32 242)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Robot Delivery</text>
      <text x="12" y="39" class="detail">Entregas e intercambios</text>
    </g>
  </g>

  <g transform="translate(894 295)">
    <use href="#panel"/>
    <rect x="15" y="15" width="34" height="34" rx="9" fill="#e7eced"/>
    <g transform="translate(20 20)" class="icon" color="#4b6870">
      <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Zm0 3h16M7 15h4"/>
    </g>
    <text x="60" y="38" class="group">Cuentas y asistencia</text>
    <use href="#branches" x="16" y="52" class="rail"/>
    <path d="M129 233v123" class="edge" marker-end="url(#arrow)"/>
    <g transform="translate(32 65)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Stripe Payments</text>
      <text x="12" y="39" class="detail">Pagos de prueba</text>
    </g>
    <g transform="translate(32 124)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Guest Folio</text>
      <text x="12" y="39" class="detail">Saldo y movimientos</text>
    </g>
    <g transform="translate(32 183)">
      <use href="#node"/>
      <text x="12" y="21" class="role">Human Handoff</text>
      <text x="12" y="39" class="detail">Traspaso a recepción</text>
    </g>
  </g>

  <g transform="translate(48 654)">
    <rect width="822" height="74" rx="14" fill="#f0f4ec" stroke="#d1ddcf"/>
    <rect x="16" y="17" width="40" height="40" rx="10" fill="#e0e9df"/>
    <g transform="translate(24 25)" class="icon" color="#426453">
      <path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>
    </g>
    <text x="70" y="33" class="title">Herramientas MCP</text>
    <text x="70" y="54" class="caption">Acceso a datos y operaciones del hotel</text>
    <path d="M431 20v34" stroke="#cdd9cc"/>
    <text x="454" y="43" class="caption">Inventario, pedidos, vuelos, pagos y folios</text>
  </g>
  <g transform="translate(894 654)">
    <rect width="258" height="74" rx="14" fill="#fffcf5" stroke="#ded7c6"/>
    <rect x="16" y="17" width="40" height="40" rx="10" fill="#f0eadc"/>
    <g transform="translate(24 25)" class="icon" color="#74623e">
      <path d="M4 13V11a8 8 0 0 1 16 0v2M4 12h1a2 2 0 0 1 2 2v3H5a2 2 0 0 1-2-2v-2a1 1 0 0 1 1-1Zm16 0h-1a2 2 0 0 0-2 2v3h2a2 2 0 0 0 2-2v-2a1 1 0 0 0-1-1Zm0 5a4 4 0 0 1-4 4h-3"/>
    </g>
    <text x="70" y="34" class="title">Recepción</text>
    <text x="70" y="54" class="caption">Atención 24/7</text>
  </g>
</svg>
